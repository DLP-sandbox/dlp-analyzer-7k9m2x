name: Keep Streamlit App Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping app health endpoint
        run: |
          URL="https://7k9m2x-mfrapp6hajphuaxr43urtp.streamlit.app/_stcore/health"
          echo "Pinging: $URL"
          STATUS=$(curl -sL --max-time 60 \
            -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -A "GitHubActions-KeepWarm/1.0" \
            -o /tmp/response.html \
            -w "%{http_code}" \
            "$URL")
          echo "HTTP Status: $STATUS"
          rm -f /tmp/cookies.txt /tmp/response.html
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Ping returned $STATUS instead of 200"
            exit 1
          fi
          echo "✓ App responded OK — container kept warm"
