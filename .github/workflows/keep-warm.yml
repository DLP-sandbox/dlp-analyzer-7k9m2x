name: Keep Streamlit App Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping app health endpoint
        env:
          # La URL vive en un SECRET del repo (Settings → Secrets and variables
          # → Actions), NO hardcodeada, porque este repo es público y hardcodear
          # el link lo expondría. Para cambiar el link en el futuro, solo se
          # edita el secret — sin tocar código.
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::El secret STREAMLIT_APP_URL no está configurado — se omite el ping."
            echo "Configúralo en: Settings → Secrets and variables → Actions → New repository secret"
            echo "  Nombre:  STREAMLIT_APP_URL"
            echo "  Valor:   https://TU-LINK-NUEVO.streamlit.app"
            exit 0
          fi

          # Normaliza: quita '/' final y apunta al endpoint de salud de Streamlit.
          BASE="${APP_URL%/}"
          URL="$BASE/_stcore/health"
          echo "Haciendo ping al endpoint de salud (URL oculta por seguridad)…"

          # Varios intentos: una app recién despertando puede tardar unos segundos.
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl -sSL --max-time 45 \
              -A "GitHubActions-KeepWarm/1.0" \
              -o /dev/null \
              -w "%{http_code}" \
              "$URL" || echo "000")
            echo "Intento $attempt → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ App despierta — contenedor mantenido activo."
              exit 0
            fi
            sleep 15
          done

          # No fallamos el job (evita correos de 'all jobs failed' cada 5 min).
          # Solo dejamos una advertencia visible en la pestaña Actions.
          echo "::warning::La app no respondió 200 tras 5 intentos. Puede estar hibernando o el secret apunta a un link viejo. Revisa STREAMLIT_APP_URL."
          exit 0
